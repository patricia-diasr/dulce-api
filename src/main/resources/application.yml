spring:
  application:
    name: dulce-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

# Configurações próprias da aplicação (fora do namespace "spring")
app:
  cors:
    # Origem(ns) permitida(s) para o frontend, separadas por vírgula
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Obrigatório via variável de ambiente — sem valor padrão de propósito
    secret: ${APP_JWT_SECRET}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:480}
  verification-code:
    expiration-minutes: 10
